name: Promemoria partite Trevigliese

# Gira ogni 6 ore (06:00, 12:00, 18:00, 00:00 UTC) + puoi lanciarlo anche a mano
# dalla scheda "Actions" del repository per testarlo subito, senza aspettare.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  invia-promemoria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa le dipendenze
        working-directory: scripts
        run: npm install

      - name: Invia i promemoria
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-reminders.js
