<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Planner PRO — proposta grafica</title>
<style>
:root{
  color-scheme: light;
  --campo: #163c2c;
  --campo-deep: #0e2a1f;
  --calce: #faf9f3;
  --carta: #ffffff;
  --inchiostro: #15181a;
  --inchiostro-soft: #5c655f;
  --riga: #dde3d7;
  --tr: #1d5fbf;
  --vg: #7a1230;
  --gl: #b9800e;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--calce);
  color:var(--inchiostro);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:84px;
}

/* ---------- phone frame for preview ---------- */
.frame{
  max-width:420px;
  margin:0 auto;
  min-height:100vh;
  background:var(--calce);
  position:relative;
  box-shadow:0 0 40px rgba(0,0,0,0.08);
}

/* ---------- header ---------- */
.hero-header{
  background:
    radial-gradient(circle at 85% -10%, rgba(255,255,255,0.08), transparent 55%),
    linear-gradient(165deg, var(--campo) 0%, var(--campo-deep) 100%);
  color:var(--calce);
  padding:22px 20px 20px;
  position:relative;
  overflow:hidden;
}
.hero-header::after{
  content:"";
  position:absolute;
  right:-60px; top:-60px;
  width:220px; height:220px;
  border:1.5px solid rgba(255,255,255,0.08);
  border-radius:50%;
}
.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
.hero-top .app-name{
  font-size:13px;
  font-weight:600;
  letter-spacing:0.01em;
  opacity:0.75;
}
.hero-top .data-oggi{
  font-size:12px;
  opacity:0.6;
}
.hero-label{
  margin-top:18px;
  font-size:13px;
  color:rgba(250,249,243,0.65);
}
.hero-main{
  display:flex;
  align-items:flex-end;
  gap:14px;
  margin-top:4px;
}
.hero-count{
  font-size:76px;
  font-weight:800;
  line-height:0.82;
  letter-spacing:-0.03em;
}
.hero-count-unit{
  font-size:17px;
  font-weight:600;
  padding-bottom:10px;
  color:rgba(250,249,243,0.75);
}
.hero-fixture{
  margin-top:14px;
  font-size:19px;
  font-weight:700;
  line-height:1.25;
}
.hero-fixture .badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:22px;height:22px;
  border-radius:50%;
  font-size:10px;
  font-weight:800;
  margin-right:6px;
  vertical-align:-5px;
}
.hero-meta{
  margin-top:10px;
  display:flex;
  gap:16px;
  font-size:13px;
  color:rgba(250,249,243,0.78);
}
.hero-meta .row{display:flex; align-items:center; gap:6px;}
.hero-meta a{
  color:inherit;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:6px;
}
.hero-meta a:hover{text-decoration:underline;}
.hero-meta a svg{flex:none;}
.hero-giornata{
  display:inline-block;
  margin-top:12px;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:0.02em;
  color:var(--campo-deep);
  background:rgba(250,249,243,0.9);
  padding:4px 10px;
  border-radius:20px;
}

/* ---------- sections ---------- */
main{padding:18px 18px 10px;}
.section{display:none;}
.section.active{display:block;}

h2.section-title{
  font-size:16px;
  font-weight:700;
  margin:4px 2px 14px;
}

/* up-next strip on home */
.upnext-strip .card{margin-bottom:10px;}

/* ---------- team filter chips ---------- */
.chip-row{
  display:flex;
  flex-wrap:nowrap;
  gap:6px;
  margin-bottom:16px;
  width:100%;
}
.chip{
  flex:1 1 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:7px 6px;
  border-radius:20px;
  border:1px solid var(--riga);
  background:var(--carta);
  font-size:11.5px;
  font-weight:600;
  color:var(--inchiostro-soft);
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.chip.active{
  background:var(--inchiostro);
  color:var(--calce);
  border-color:var(--inchiostro);
}
.chip.active .dot{box-shadow:0 0 0 2px rgba(255,255,255,0.5);}

/* ---------- ticket-style match card ---------- */
.card-list{display:flex; flex-direction:column; gap:10px;}
.card{
  display:flex;
  background:var(--carta);
  border:1px solid var(--riga);
  border-radius:10px;
  overflow:hidden;
}
.card.next{
  border-color:var(--accent, var(--riga));
  box-shadow:0 0 0 1px var(--accent, transparent);
  background:linear-gradient(0deg, var(--carta), var(--carta)) padding-box,
             var(--carta);
}
.card.next .stub{
  background:color-mix(in srgb, var(--accent, var(--riga)) 10%, var(--carta));
}
.next-tag{
  display:inline-block;
  color:#fff;
  font-size:9px;
  font-weight:800;
  letter-spacing:0.03em;
  text-transform:uppercase;
  padding:2px 6px;
  border-radius:6px;
  margin-left:6px;
  vertical-align:1px;
}
.card .stub{
  flex:none;
  width:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px 4px;
  border-right:1px dashed var(--riga);
  position:relative;
}
.card .stub .day{
  font-size:24px;
  font-weight:800;
  line-height:1;
  letter-spacing:-0.02em;
}
.card .stub .mon{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:0.04em;
  color:var(--inchiostro-soft);
  margin-top:2px;
}
.card .stub .wk{
  font-size:9.5px;
  color:var(--inchiostro-soft);
  margin-top:1px;
}
.card .body{
  flex:1;
  padding:11px 13px;
  min-width:0;
}
.card .body .top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
}
.card .badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;height:18px;
  border-radius:50%;
  font-size:8.5px;
  font-weight:800;
  color:#fff;
  flex:none;
}
.card .team-name{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:700;
  color:var(--inchiostro-soft);
}
.card .time-col{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:3px;
}
.card .time{
  font-size:12.5px;
  font-weight:700;
  color:var(--inchiostro);
}
.card .giornata-tag{
  font-size:9.5px;
  font-weight:800;
  letter-spacing:0.02em;
  color:#fff;
  background:var(--inchiostro-soft);
  padding:1px 6px;
  border-radius:7px;
}
.card .fixture{
  font-size:14.5px;
  font-weight:700;
  margin-bottom:5px;
  line-height:1.3;
}
.card .place-row{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--inchiostro-soft);
}
.card .place-row a{
  color:var(--inchiostro-soft);
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:4px;
}
.card .place-row svg{flex:none;}
.card .place-row a:hover{color:var(--inchiostro);}

/* venues list — simple record rows, not cards */
.venue-row{
  padding:13px 2px;
  border-bottom:1px solid var(--riga);
}
.venue-row:first-child{border-top:1px solid var(--riga);}
.venue-row .vtop{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:3px;
}
.venue-row .vname{font-size:14px; font-weight:700;}
.venue-row .home-tag{
  font-size:10px;
  font-weight:700;
  color:var(--campo);
  background:var(--riga);
  padding:2px 7px;
  border-radius:10px;
  margin-left:6px;
}
.venue-row .vfield{font-size:12.5px; color:var(--inchiostro-soft); margin-bottom:4px;}
.venue-row .vmeta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--inchiostro-soft);
}
.venue-row .vmeta a{color:var(--tr); text-decoration:none; font-weight:600; display:flex; align-items:center; gap:3px;}

/* ---------- Classifiche ---------- */
.standings-card{
  background:var(--carta);
  border:1px solid var(--riga);
  border-radius:12px;
  overflow:hidden;
}
.standings-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  border-bottom:1px solid var(--riga);
}
.standings-top .st-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:700;
}
.standings-top a{
  font-size:12px;
  font-weight:700;
  color:var(--campo);
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
}
.standings-frame-wrap{
  position:relative;
  background:var(--calce);
  height:420px;
  overflow:hidden;
}
.standings-frame-wrap iframe{
  width:133.33%;
  height:560px;
  border:none;
  display:block;
  transform:scale(0.75);
  transform-origin:top left;
}
.standings-fallback{
  padding:10px 14px;
  font-size:11.5px;
  color:var(--inchiostro-soft);
  background:#f3f1ea;
  border-top:1px solid var(--riga);
  line-height:1.5;
}
.standings-fallback a{color:var(--campo); font-weight:700; text-decoration:none;}

/* ---------- Conflitti ---------- */
.settings-box{
  background:var(--carta);
  border:1px solid var(--riga);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:16px;
}
.settings-box .settings-title{
  font-size:11.5px;
  font-weight:700;
  color:var(--inchiostro-soft);
  margin-bottom:8px;
}
.settings-row{
  display:flex;
  gap:14px;
}
.settings-field{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.settings-field label{
  font-size:11px;
  color:var(--inchiostro-soft);
}
.settings-field .input-wrap{
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--riga);
  border-radius:8px;
  padding:5px 8px;
}
.settings-field input{
  width:100%;
  border:none;
  outline:none;
  font-size:14px;
  font-weight:700;
  color:var(--inchiostro);
  background:transparent;
  font-family:inherit;
}
.settings-field .unit{font-size:11px; color:var(--inchiostro-soft);}

.conflict-card{
  background:var(--carta);
  border:1px solid var(--riga);
  border-radius:12px;
  margin-bottom:14px;
  overflow:hidden;
}
.conflict-head{
  background:var(--campo-deep);
  color:var(--calce);
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
.conflict-head .cdate{font-size:13px; font-weight:700;}
.conflict-head .coverlap{font-size:11px; color:rgba(250,249,243,0.65);}
.conflict-matches{padding:12px 14px 4px;}
.conflict-match-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid var(--riga);
  font-size:12.5px;
}
.conflict-match-row:last-child{border-bottom:none;}
.conflict-match-row .cm-team{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:700;
}
.conflict-match-row .cm-when{
  color:var(--inchiostro-soft);
  font-weight:600;
  text-align:right;
}
.conflict-options{padding:4px 14px 14px;}
.option-box{
  margin-top:10px;
  padding:10px 12px;
  border-radius:10px;
  background:var(--verde-chiaro, #eef3ec);
  border-left:3px solid var(--campo);
}
.option-box .opt-label{
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.03em;
  color:var(--campo-deep);
  margin-bottom:4px;
}
.option-box.alt{
  background:#f3f1ea;
  border-left-color:var(--inchiostro-soft);
}
.option-box.alt .opt-label{color:var(--inchiostro-soft);}
.option-box p{
  margin:0;
  font-size:12.5px;
  line-height:1.5;
  color:var(--inchiostro);
}

/* empty state */
.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--inchiostro-soft);
  font-size:13.5px;
  line-height:1.5;
}

/* ---------- bottom nav — scoreboard strip, not iOS pills ---------- */
nav.tabbar{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:100%;
  max-width:420px;
  background:var(--inchiostro);
  display:flex;
}
.tabbar button{
  flex:1;
  min-width:0;
  background:none;
  border:none;
  color:rgba(250,249,243,0.45);
  font-size:9.5px;
  font-weight:700;
  letter-spacing:0.01em;
  padding:12px 2px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  position:relative;
  cursor:pointer;
}
.tabbar button span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.tabbar button svg{opacity:0.75;}
.tabbar button.active{color:var(--calce);}
.tabbar button.active::before{
  content:"";
  position:absolute;
  top:0; left:18%; right:18%;
  height:2px;
  background:var(--calce);
}
</style>
</head>
<body>
<div class="frame">

  <header class="hero-header" id="hero"></header>

  <main>
    <div id="sec-home" class="section active">
      <div id="upnext-strip"></div>
    </div>

    <div id="sec-calendar" class="section">
      <h2 class="section-title">Calendario</h2>
      <div class="chip-row" id="cal-chips"></div>
      <div class="card-list" id="cal-list"></div>
    </div>

    <div id="sec-venues" class="section">
      <h2 class="section-title">Campi</h2>
      <div class="chip-row" id="venue-chips"></div>
      <div id="venue-list"></div>
    </div>

    <div id="sec-standings" class="section">
      <h2 class="section-title">Classifiche</h2>
      <div class="chip-row" id="standings-chips"></div>
      <div id="standings-content"></div>
    </div>

    <div id="sec-conflicts" class="section">
      <h2 class="section-title">Conflitti</h2>
      <div class="settings-box">
        <div class="settings-title">Ipotesi di calcolo (modificale se conosci i tempi reali)</div>
        <div class="settings-row">
          <div class="settings-field">
            <label>Spostamento tra i campi</label>
            <div class="input-wrap">
              <input type="number" id="travel-min" value="15" min="0" max="90">
              <span class="unit">min</span>
            </div>
          </div>
          <div class="settings-field">
            <label>Contingency</label>
            <div class="input-wrap">
              <input type="number" id="contingency-min" value="7" min="0" max="30">
              <span class="unit">min</span>
            </div>
          </div>
        </div>
      </div>
      <div id="conflicts-list"></div>
    </div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

/* ============== HELPERS ============== */
const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const GIORNI = ["dom","lun","mar","mer","gio","ven","sab"];
const MESI_LUNGHI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

function mapsUrl(m){ return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.addr+' '+m.place)}`; }

function daysUntil(d, now){
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((b-a)/86400000);
}

function badge(catKey, size){
  const t = TEAMS[catKey];
  return `<span class="badge" style="background:${t.color};${size?`width:${size}px;height:${size}px;font-size:${size*0.42}px;`:''}">${t.short}</span>`;
}

/* ============== RENDER: HERO (prossimo impegno, su tutte le squadre) ============== */
function renderHero(now){
  const upcoming = matches
    .map(m => ({...m, dt:new Date(m.date)}))
    .filter(m => m.dt.getTime()+2*3600000 > now.getTime())
    .sort((a,b)=>a.dt-b.dt);

  const hero = document.getElementById('hero');
  if (upcoming.length === 0){
    hero.innerHTML = `<div class="hero-top"><span class="app-name">Football Planner PRO</span></div>
      <div class="hero-fixture" style="margin-top:30px;">Nessun impegno in programma.</div>`;
    return;
  }
  const next = upcoming[0];
  const t = TEAMS[next.cat];
  const days = daysUntil(next.dt, now);
  const label = days===0 ? "si gioca oggi" : days===1 ? "si gioca domani" : `tra ${days} giorni`;
  const dataLunga = `${GIORNI[next.dt.getDay()]} ${next.dt.getDate()} ${MESI_LUNGHI[next.dt.getMonth()]}`;
  const ora = next.dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  const localitaBreve = next.addr.split(',')[1]?.trim() || next.addr;
  const giornataChip = next.giornata ? `<span class="hero-giornata">Giornata ${next.giornata}</span>` : '';

  hero.innerHTML = `
    <div class="hero-top">
      <span class="app-name">Football Planner PRO</span>
      <span class="data-oggi">${GIORNI[now.getDay()]} ${now.getDate()} ${MESI[now.getMonth()]}</span>
    </div>
    <div class="hero-label">Prossimo impegno — ${t.label}</div>
    <div class="hero-main">
      <div class="hero-count">${days}</div>
      <div class="hero-count-unit">${label.replace(/^(tra \d+ )/,'')}</div>
    </div>
    <div class="hero-fixture">${badge(next.cat,22)}${next.title}</div>
    <div class="hero-meta">
      <span class="row">${ICO.clock} ${dataLunga.charAt(0).toUpperCase()+dataLunga.slice(1)}, ${ora}</span>
    </div>
    <div class="hero-meta" style="margin-top:4px;">
      <a href="${mapsUrl(next)}" target="_blank">${ICO.pin} ${next.place} — ${localitaBreve}</a>
    </div>
    ${giornataChip}
  `;
}

/* ============== RENDER: HOME — in arrivo per le altre due squadre ============== */
function renderUpNext(now){
  const container = document.getElementById('upnext-strip');
  const nowT = now.getTime();

  const nextByCat = Object.keys(TEAMS).map(cat=>{
    const list = matches.filter(m=>m.cat===cat)
      .map(m=>({...m, dt:new Date(m.date)}))
      .filter(m=>m.dt.getTime()+2*3600000 > nowT)
      .sort((a,b)=>a.dt-b.dt);
    return list[0];
  }).filter(Boolean).sort((a,b)=>a.dt-b.dt);

  // togliamo quella già mostrata in hero (la più imminente in assoluto)
  const rest = nextByCat.slice(1);

  if (rest.length === 0){
    container.innerHTML = `<h2 class="section-title">Le altre squadre</h2><div class="empty-state">Nessun altro impegno nei prossimi giorni.</div>`;
    return;
  }

  let html = `<h2 class="section-title">In arrivo anche</h2><div class="upnext-strip">`;
  rest.forEach(m=>{
    html += matchCard(m, now);
  });
  html += `</div>`;
  container.innerHTML = html;
}

/* ============== CARD PARTITA (stile tagliando) ============== */
function matchKey(m){ return m.cat + '|' + m.date; }

function nextMatchKeys(now){
  const nowT = now.getTime();
  const keys = new Set();
  Object.keys(TEAMS).forEach(cat=>{
    const next = matches.filter(m=>m.cat===cat)
      .map(m=>({...m, dt:new Date(m.date)}))
      .filter(m=>m.dt.getTime()+2*3600000 > nowT)
      .sort((a,b)=>a.dt-b.dt)[0];
    if (next) keys.add(matchKey(next));
  });
  return keys;
}

function matchCard(m, now, isNext){
  const t = TEAMS[m.cat];
  const ora = m.dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  return `
    <div class="card ${isNext ? 'next' : ''}" style="${isNext ? `--accent:${t.color};` : ''}">
      <div class="stub" style="color:${t.color};">
        <div class="day">${m.dt.getDate()}</div>
        <div class="mon">${MESI[m.dt.getMonth()].toUpperCase()}</div>
        <div class="wk">${GIORNI[m.dt.getDay()]}</div>
      </div>
      <div class="body">
        <div class="top-row">
          <span class="team-name">${badge(m.cat,18)}${t.label}${isNext ? '<span class="next-tag" style="background:'+t.color+'">Prossima</span>' : ''}</span>
          <span class="time-col">
            <span class="time">${ora}</span>
            ${m.giornata ? `<span class="giornata-tag">G${m.giornata}</span>` : ''}
          </span>
        </div>
        <div class="fixture">${m.title}</div>
        <div class="place-row">
          ${ICO.pin}
          <a href="${mapsUrl(m)}" target="_blank">${m.place} ${ICO.arrow}</a>
        </div>
      </div>
    </div>
  `;
}

/* ============== RENDER: CALENDARIO ============== */
function renderCalendarChips(){
  const el = document.getElementById('cal-chips');
  const all = [{key:'all', label:'Tutte', color:'#15181a'}, ...Object.entries(TEAMS).map(([k,v])=>({key:k,label:v.short,color:v.color}))];
  el.innerHTML = all.map((c,i)=>`
    <button class="chip ${i===0?'active':''}" data-filter="${c.key}">
      <span class="dot" style="background:${c.color}"></span>${c.key==='all'?'Tutte':TEAMS[c.key].chipLabel}
    </button>
  `).join('');
  el.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
      el.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderCalendarList(btn.dataset.filter);
    });
  });
}

function renderCalendarList(filter){
  const container = document.getElementById('cal-list');
  const now = new Date();
  const nextKeys = nextMatchKeys(now);
  const list = matches
    .map(m=>({...m, dt:new Date(m.date)}))
    .filter(m=> filter==='all' || m.cat===filter)
    .sort((a,b)=>a.dt-b.dt);

  if (list.length===0){
    container.innerHTML = `<div class="empty-state">Nessuna partita per questo filtro.</div>`;
    return;
  }
  container.innerHTML = list.map(m=>matchCard(m, now, nextKeys.has(matchKey(m)))).join('');
}

function renderVenueChips(){
  const el = document.getElementById('venue-chips');
  const all = [{key:'all', label:'Tutti'}, ...Object.entries(TEAMS).map(([k,v])=>({key:k, label:v.short}))];
  el.innerHTML = all.map((c,i)=>`
    <button class="chip ${i===0?'active':''}" data-vfilter="${c.key}">
      ${c.key==='all' ? 'Tutti' : `<span class="dot" style="background:${TEAMS[c.key].color}"></span>${TEAMS[c.key].chipLabel}`}
    </button>
  `).join('');
  el.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
      el.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderVenueList(btn.dataset.vfilter);
    });
  });
}

function renderVenueList(filter){
  const container = document.getElementById('venue-list');
  const list = venues.filter(v=> filter==='all' || v.cat===filter)
    .sort((a,b)=> (b.home?1:0)-(a.home?1:0) || a.name.localeCompare(b.name));
  if (list.length===0){
    container.innerHTML = `<div class="empty-state">Nessun campo per questo filtro.</div>`;
    return;
  }
  container.innerHTML = list.map(v=>`
    <div class="venue-row">
      <div class="vtop">${badge(v.cat,16)}<span class="vname">${v.name}</span>${v.home?'<span class="home-tag">Casa</span>':''}</div>
      <div class="vfield">${v.field} — ${v.loc}</div>
      <div class="vmeta">
        <span>${v.when}</span>
        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.addr+' '+v.loc)}" target="_blank">${v.addr} ${ICO.arrow}</a>
      </div>
    </div>
  `).join('');
}

  if (cat === 'mattia'){
    container.innerHTML = `
      <div class="standings-card">
        <div class="standings-top">
          <span class="st-title">${badge(cat,18)}${t.label}</span>
        </div>
        <div class="empty-state">
          Per i Pulcini 2017 non esiste una classifica ufficiale pubblicata — a questa età il torneo FIGC non la prevede.<br>
          La costruiremo noi a partire dai risultati delle giornate giocate.
        </div>
      </div>
    `;
    return;
  }

  const url = STANDINGS_URL[cat];
  container.innerHTML = `
    <div class="standings-card">
      <div class="standings-top">
        <span class="st-title">${badge(cat,18)}${t.label}</span>
        <a href="${url}" target="_blank">Apri sul sito ${ICO.arrow}</a>
      </div>
      <div class="standings-frame-wrap">
        <iframe src="${url}#tournament-standings" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="standings-fallback">
        Vista ridotta per stare nello spazio della card (salta automaticamente a dove inizia la tabella, saltando testata e menu del sito). Se risulta troppo piccola, usa il link "Apri sul sito" qui sopra per la versione a piena pagina. Se invece resta vuota, bergamotornei.com non permette l'incapsulamento e l'unica via è il link.
      </div>
    </div>
  `;
}

/* ============== CONFLITTI ============== */
// Durata effettiva delle due partite "mie" (non il campionato di Mattia, che non gioco io)
const DURATA = {
  c7:  { tempo:25, intervallo:5 },   // 25+5+25 = 55'
  c11: { tempo:40, intervallo:5 }    // 40+5+40 = 85'
};

function addMin(date, min){ return new Date(date.getTime() + min*60000); }

function finestraPartita(m){
  const d = DURATA[m.cat];
  const start = new Date(m.date);
  const t1End = addMin(start, d.tempo);
  const t2Start = addMin(t1End, d.intervallo);
  const end = addMin(t2Start, d.tempo);
  return { ...m, start, t1End, t2Start, end, tempo:d.tempo, intervallo:d.intervallo, totale:d.tempo*2+d.intervallo };
}

function fmtOra(d){ return d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }
function fmtData(d){ return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI_LUNGHI[d.getMonth()]}`; }

// Descrive "a che punto della partita a7" cade un certo minuto trascorso dal fischio d'inizio
function classificaMomento(minuti, tempo, intervallo){
  if (minuti <= 0) return "prima del fischio d'inizio";
  if (minuti < tempo) return `durante il primo tempo (minuto ${Math.round(minuti)}')`;
  if (minuti < tempo+intervallo) return `durante l'intervallo`;
  if (minuti < tempo*2+intervallo) return `durante il secondo tempo (minuto ${Math.round(minuti-tempo-intervallo)}')`;
  return `a fine partita`;
}

function getConflitti(travelMin, contingencyMin){
  const buffer = travelMin + contingencyMin; // minuti di "cuscinetto" necessari per lo spostamento
  const c7List  = matches.filter(m=>m.cat==='c7').map(finestraPartita);
  const c11List = matches.filter(m=>m.cat==='c11').map(finestraPartita);
  const conflitti = [];

  c7List.forEach(a=>{
    c11List.forEach(b=>{
      // conflitto se non c'è abbastanza margine tra la fine di una e l'inizio dell'altra, in nessuno dei due ordini
      const bufferMs = buffer*60000;
      const abbastanzaTempoAB = (a.end.getTime() + bufferMs) <= b.start.getTime();
      const abbastanzaTempoBA = (b.end.getTime() + bufferMs) <= a.start.getTime();
      if (!abbastanzaTempoAB && !abbastanzaTempoBA){
        const overlapStart = new Date(Math.max(a.start.getTime(), b.start.getTime()));
        const overlapEnd = new Date(Math.min(a.end.getTime(), b.end.getTime()));
        const overlapMin = Math.max(0, Math.round((overlapEnd-overlapStart)/60000));
        conflitti.push({ c7:a, c11:b, overlapMin });
      }
    });
  });
  return conflitti.sort((x,y)=>x.c7.start-y.c7.start);
}

// Opzione 1: gioco con la squadra a7 e poi mi sposto per Over40 — a che punto devo uscire?
function suggerimentoOpzione1(c7m, c11m, travelMin, contingencyMin){
  const buffer = travelMin + contingencyMin;
  const gapInizio = (c11m.start.getTime() - c7m.start.getTime())/60000;
  const maxPerInizio = gapInizio - buffer;

  if (maxPerInizio >= c7m.totale){
    return `Gioca tutta la partita a7 (fino alle ${fmtOra(c7m.end)}): hai comunque il tempo di arrivare per il fischio d'inizio di Over40 alle ${fmtOra(c11m.start)}.`;
  }
  if (maxPerInizio > 0){
    const leaveTime = addMin(c7m.start, maxPerInizio);
    const momento = classificaMomento(maxPerInizio, c7m.tempo, c7m.intervallo);
    return `Esci dal campo a7 ${momento} — entro le ${fmtOra(leaveTime)} — e arrivi in tempo per il fischio d'inizio di Over40 (${fmtOra(c11m.start)}).`;
  }

  // non arrivi per il fischio d'inizio: calcola il massimo per arrivare prima del 2° tempo di Over40
  const secondoTempoOver40 = c11m.t2Start;
  const maxPer2Tempo = (secondoTempoOver40.getTime() - c7m.start.getTime())/60000 - buffer;
  if (maxPer2Tempo <= 0){
    return `Con questi tempi di spostamento non arrivi nemmeno per l'inizio del secondo tempo di Over40 (${fmtOra(secondoTempoOver40)}). In questo caso l'Opzione 2 è la scelta più realistica.`;
  }
  const cap = Math.min(maxPer2Tempo, c7m.totale);
  const leaveTime2 = addMin(c7m.start, cap);
  const momento2 = classificaMomento(cap, c7m.tempo, c7m.intervallo);
  return `Non arrivi per il fischio d'inizio di Over40 (${fmtOra(c11m.start)}), ma restando a7 ${momento2} — fino alle ${fmtOra(leaveTime2)} — arrivi giusto in tempo per l'inizio del secondo tempo di Over40 (${fmtOra(secondoTempoOver40)}).`;
}

function renderConflicts(){
  const travelMin = parseFloat(document.getElementById('travel-min').value) || 0;
  const contingencyMin = parseFloat(document.getElementById('contingency-min').value) || 0;
  const conflitti = getConflitti(travelMin, contingencyMin);
  const container = document.getElementById('conflicts-list');

  if (conflitti.length===0){
    container.innerHTML = `<div class="empty-state">Nessun conflitto rilevato con questi tempi di spostamento. Se li riduci potresti scoprirne qualcuno nascosto, se li aumenti qualcuno potrebbe sparire.</div>`;
    return;
  }

  container.innerHTML = conflitti.map(({c7:a, c11:b, overlapMin})=>{
    const opt1 = suggerimentoOpzione1(a, b, travelMin, contingencyMin);
    const overlapText = overlapMin > 0
      ? `${overlapMin}' di sovrapposizione diretta`
      : `nessun minuto di sovrapposizione, ma margine insufficiente per lo spostamento`;
    return `
      <div class="conflict-card">
        <div class="conflict-head">
          <span class="cdate">${fmtData(a.start).charAt(0).toUpperCase()+fmtData(a.start).slice(1)}</span>
          <span class="coverlap">${overlapText}</span>
        </div>
        <div class="conflict-matches">
          <div class="conflict-match-row">
            <span class="cm-team">${badge('c7',18)}${TEAMS.c7.label} — ${a.title}</span>
            <span class="cm-when">${fmtOra(a.start)}–${fmtOra(a.end)}</span>
          </div>
          <div class="conflict-match-row">
            <span class="cm-team">${badge('c11',18)}${TEAMS.c11.label} — ${b.title}</span>
            <span class="cm-when">${fmtOra(b.start)}–${fmtOra(b.end)}</span>
          </div>
        </div>
        <div class="conflict-options">
          <div class="option-box">
            <div class="opt-label">Opzione 1 — dividersi tra le due</div>
            <p>${opt1}</p>
          </div>
          <div class="option-box alt">
            <div class="opt-label">Opzione 2 — una sola squadra</div>
            <p>Gioca per intero una sola delle due partite e salta l'altra per questa giornata — nessun calcolo di spostamento necessario.</p>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function initConflicts(){
  renderConflicts();
  document.getElementById('travel-min').addEventListener('input', renderConflicts);
  document.getElementById('contingency-min').addEventListener('input', renderConflicts);
}
