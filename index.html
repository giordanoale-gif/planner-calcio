<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Planner PRO — proposta grafica</title>
<style>
:root{
  color-scheme: light;
  --campo: #163c2c;
  --campo-deep: #0e2a1f;
  --calce: #faf9f3;
  --carta: #ffffff;
  --inchiostro: #15181a;
  --inchiostro-soft: #5c655f;
  --riga: #dde3d7;
  --tr: #1d5fbf;
  --vg: #7a1230;
  --gl: #b9800e;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--calce);
  color:var(--inchiostro);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:84px;
}

/* ---------- phone frame for preview ---------- */
.frame{
  max-width:420px;
  margin:0 auto;
  min-height:100vh;
  background:var(--calce);
  position:relative;
  box-shadow:0 0 40px rgba(0,0,0,0.08);
}

/* ---------- header ---------- */
.hero-header{
  background:
    radial-gradient(circle at 85% -10%, rgba(255,255,255,0.08), transparent 55%),
    linear-gradient(165deg, var(--campo) 0%, var(--campo-deep) 100%);
  color:var(--calce);
  padding:22px 20px 20px;
  position:relative;
  overflow:hidden;
}
.hero-header::after{
  content:"";
  position:absolute;
  right:-60px; top:-60px;
  width:220px; height:220px;
  border:1.5px solid rgba(255,255,255,0.08);
  border-radius:50%;
}
.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
.hero-top .app-name{
  font-size:13px;
  font-weight:600;
  letter-spacing:0.01em;
  opacity:0.75;
}
.hero-top .data-oggi{
  font-size:12px;
  opacity:0.6;
}
.hero-label{
  margin-top:18px;
  font-size:13px;
  color:rgba(250,249,243,0.65);
}
.hero-main{
  display:flex;
  align-items:flex-end;
  gap:14px;
  margin-top:4px;
}
.hero-count{
  font-size:76px;
  font-weight:800;
  line-height:0.82;
  letter-spacing:-0.03em;
}
.hero-count-unit{
  font-size:17px;
  font-weight:600;
  padding-bottom:10px;
  color:rgba(250,249,243,0.75);
}
.hero-fixture{
  margin-top:14px;
  font-size:19px;
  font-weight:700;
  line-height:1.25;
}
.hero-fixture .badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:22px;height:22px;
  border-radius:50%;
  font-size:10px;
  font-weight:800;
  margin-right:6px;
  vertical-align:-5px;
}
.hero-meta{
  margin-top:10px;
  display:flex;
  gap:16px;
  font-size:13px;
  color:rgba(250,249,243,0.78);
}
.hero-meta .row{display:flex; align-items:center; gap:6px;}
.hero-meta a{
  color:inherit;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:6px;
}
.hero-meta a:hover{text-decoration:underline;}
.hero-meta a svg{flex:none;}
.hero-giornata{
  display:inline-block;
  margin-top:12px;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:0.02em;
  color:var(--campo-deep);
  background:rgba(250,249,243,0.9);
  padding:4px 10px;
  border-radius:20px;
}

/* ---------- sections ---------- */
main{padding:18px 18px 10px;}
.section{display:none;}
.section.active{display:block;}

h2.section-title{
  font-size:16px;
  font-weight:700;
  margin:4px 2px 14px;
}

/* up-next strip on home */
.upnext-strip .card{margin-bottom:10px;}

/* ---------- team filter chips ---------- */
.chip-row{
  display:flex;
  flex-wrap:nowrap;
  gap:6px;
  margin-bottom:16px;
  width:100%;
}
.chip{
  flex:1 1 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:7px 6px;
  border-radius:20px;
  border:1px solid var(--riga);
  background:var(--carta);
  font-size:11.5px;
  font-weight:600;
  color:var(--inchiostro-soft);
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.chip.active{
  background:var(--inchiostro);
  color:var(--calce);
  border-color:var(--inchiostro);
}
.chip.active .dot{box-shadow:0 0 0 2px rgba(255,255,255,0.5);}

/* ---------- ticket-style match card ---------- */
.card-list{display:flex; flex-direction:column; gap:10px;}
.card{
  display:flex;
  background:var(--carta);
  border:1px solid var(--riga);
  border-radius:10px;
  overflow:hidden;
}
.card.next{
  border-color:var(--accent, var(--riga));
  box-shadow:0 0 0 1px var(--accent, transparent);
  background:linear-gradient(0deg, var(--carta), var(--carta)) padding-box,
             var(--carta);
}
.card.next .stub{
  background:color-mix(in srgb, var(--accent, var(--riga)) 10%, var(--carta));
}
.next-tag{
  display:inline-block;
  color:#fff;
  font-size:9px;
  font-weight:800;
  letter-spacing:0.03em;
  text-transform:uppercase;
  padding:2px 6px;
  border-radius:6px;
  margin-left:6px;
  vertical-align:1px;
}
.card .stub{
  flex:none;
  width:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px 4px;
  border-right:1px dashed var(--riga);
  position:relative;
}
.card .stub .day{
  font-size:24px;
  font-weight:800;
  line-height:1;
  letter-spacing:-0.02em;
}
.card .stub .mon{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:0.04em;
  color:var(--inchiostro-soft);
  margin-top:2px;
}
.card .stub .wk{
  font-size:9.5px;
  color:var(--inchiostro-soft);
  margin-top:1px;
}
.card .body{
  flex:1;
  padding:11px 13px;
  min-width:0;
}
.card .body .top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
}
.card .badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;height:18px;
  border-radius:50%;
  font-size:8.5px;
  font-weight:800;
  color:#fff;
  flex:none;
}
.card .team-name{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:700;
  color:var(--inchiostro-soft);
}
.card .time-col{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:3px;
}
.card .time{
  font-size:12.5px;
  font-weight:700;
  color:var(--inchiostro);
}
.card .giornata-tag{
  font-size:9.5px;
  font-weight:800;
  letter-spacing:0.02em;
  color:#fff;
  background:var(--inchiostro-soft);
  padding:1px 6px;
  border-radius:7px;
}
.card .fixture{
  font-size:14.5px;
  font-weight:700;
  margin-bottom:5px;
  line-height:1.3;
}
.card .place-row{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--inchiostro-soft);
}
.card .place-row a{
  color:var(--inchiostro-soft);
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:4px;
}
.card .place-row svg{flex:none;}
.card .place-row a:hover{color:var(--inchiostro);}

/* venues list — simple record rows, not cards */
.venue-row{
  padding:13px 2px;
  border-bottom:1px solid var(--riga);
}
.venue-row:first-child{border-top:1px solid var(--riga);}
.venue-row .vtop{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:3px;
}
.venue-row .vname{font-size:14px; font-weight:700;}
.venue-row .home-tag{
  font-size:10px;
  font-weight:700;
  color:var(--campo);
  background:var(--riga);
  padding:2px 7px;
  border-radius:10px;
  margin-left:6px;
}
.venue-row .vfield{font-size:12.5px; color:var(--inchiostro-soft); margin-bottom:4px;}
.venue-row .vmeta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--inchiostro-soft);
}
.venue-row .vmeta a{color:var(--tr); text-decoration:none; font-weight:600; display:flex; align-items:center; gap:3px;}

/* ---------- Classifiche ---------- */
.standings-card{
  background:var(--carta);
  border:1px solid var(--riga);
  border-radius:12px;
  overflow:hidden;
}
.standings-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  border-bottom:1px solid var(--riga);
}
.standings-top .st-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:700;
}
.standings-top a{
  font-size:12px;
  font-weight:700;
  color:var(--campo);
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
}
.standings-frame-wrap{
  position:relative;
  background:var(--calce);
  height:420px;
  overflow:hidden;
}
.standings-frame-wrap iframe{
  width:133.33%;
  height:560px;
  border:none;
  display:block;
  transform:scale(0.75);
  transform-origin:top left;
}
.standings-fallback{
  padding:10px 14px;
  font-size:11.5px;
  color:var(--inchiostro-soft);
  background:#f3f1ea;
  border-top:1px solid var(--riga);
  line-height:1.5;
}
.standings-fallback a{color:var(--campo); font-weight:700; text-decoration:none;}

.backup-row{
  display:flex;
  gap:8px;
  padding:0 14px 14px;
}
.backup-row button, .backup-row .import-label{
  flex:1;
  text-align:center;
  font-size:11px;
  font-weight:700;
  color:var(--inchiostro-soft);
  background:var(--riga);
  border:none;
  border-radius:8px;
  padding:7px 4px;
  cursor:pointer;
}
.import-label{ position:relative; overflow:hidden; display:block; }
.import-label input{ position:absolute; inset:0; opacity:0; cursor:pointer; }

.cloud-status{
  font-size:10px;
  font-weight:700;
  padding:3px 8px;
  border-radius:10px;
  background:var(--riga);
  color:var(--inchiostro-soft);
}
.cloud-status.synced{ background:#e3f1e6; color:var(--campo-deep); }
.cloud-status.error{ background:#f6e2e2; color:#8c2b2b; }

.stat-row{ display:flex; }
.stat-card{
  flex:1;
  text-align:center;
  padding:14px 6px;
  border-right:1px solid var(--riga);
}
.stat-card:last-child{border-right:none;}
.stat-value{ font-size:24px; font-weight:800; color:var(--campo-deep); line-height:1; }
.stat-label{ font-size:10.5px; color:var(--inchiostro-soft); margin-top:5px; line-height:1.25; }

.scorer-row{ border-bottom:1px solid var(--riga); }
.scorer-row:last-child{ border-bottom:none; }
.scorer-row-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  cursor:pointer;
}
.scorer-name{ font-size:13px; font-weight:600; }
.scorer-row.mine{ background:#fdf3e2; }
.scorer-row.mine .scorer-name{ font-weight:800; color:#9a6a0a; }
.scorer-row.mine .scorer-goals{ color:#9a6a0a; }
.son-tag{
  display:inline-block;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.02em;
  color:#fff;
  background:#c98a12;
  padding:2px 6px;
  border-radius:7px;
  margin-left:6px;
  vertical-align:1px;
}
.mio-figlio{ font-weight:800; color:#9a6a0a; }
.scorer-chip.mine{ background:#fdf3e2; color:#9a6a0a; }
.scorer-goals{ font-size:14px; font-weight:800; color:var(--campo-deep); }
.scorer-detail{ padding:0 14px 10px; }
.scorer-detail-item{ font-size:11.5px; color:var(--inchiostro-soft); padding:3px 0; }
.scorer-detail-item.empty{ font-style:italic; }

.match-result-row{ border-bottom:1px solid var(--riga); padding:12px 14px; }
.match-result-row:last-child{ border-bottom:none; }
.mrr-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.mrr-info{ display:flex; align-items:baseline; gap:8px; min-width:0; flex:1; cursor:pointer; }
.mrr-giornata{ font-size:11px; font-weight:800; color:var(--inchiostro-soft); flex:none; }
.mrr-title{ font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.edit-toggle-btn{
  flex:none;
  font-size:11px;
  font-weight:700;
  color:var(--campo);
  background:var(--riga);
  border:none;
  border-radius:14px;
  padding:5px 11px;
  cursor:pointer;
}
.mrr-chips{ display:flex; gap:7px; margin-top:8px; flex-wrap:wrap; cursor:pointer; }

.tempo-detail{ margin-top:10px; border-top:1px solid var(--riga); padding-top:8px; }
.tempo-detail-row{ display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:12px; }
.tdr-label{ color:var(--inchiostro-soft); font-weight:600; }
.tdr-score{ font-weight:700; padding:2px 8px; border-radius:8px; font-size:11.5px; }
.tdr-score.tdr-none{ background:#f1efe8; color:var(--inchiostro-soft); font-weight:600; }
.tdr-scorers{ font-size:11px; color:var(--inchiostro-soft); font-style:italic; margin:-2px 0 4px; padding-left:2px; }
.risultato-chip{
  font-size:11px;
  font-weight:700;
  padding:3px 9px;
  border-radius:10px;
}
.risultato-chip.esito-v, .tdr-score.esito-v{ background:#e3f1e6; color:var(--campo-deep); }
.risultato-chip.esito-p, .tdr-score.esito-p{ background:#eceae2; color:var(--inchiostro-soft); }
.risultato-chip.esito-s, .tdr-score.esito-s{ background:#f6e2e2; color:#8c2b2b; }
.risultato-chip.esito-none{ background:#f1efe8; color:var(--inchiostro-soft); }

.tempo-editor{ margin-top:12px; border-top:1px solid var(--riga); padding-top:10px; }
.tempo-edit-row{ padding:9px 0; border-bottom:1px dashed var(--riga); }
.tempo-edit-row:last-of-type{ border-bottom:none; }
.tempo-edit-head{ display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700; margin-bottom:6px; }
.tempo-free-tag{ font-size:9.5px; font-weight:700; color:var(--inchiostro-soft); background:var(--riga); padding:1px 6px; border-radius:7px; margin-left:5px; }
.tempo-for-display{ font-size:11.5px; color:var(--campo-deep); font-weight:700; }
.tempo-edit-controls{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.tempo-edit-controls label{ font-size:11.5px; color:var(--inchiostro-soft); flex:1; }
.tempo-edit-controls input{
  width:60px;
  border:1px solid var(--riga);
  border-radius:7px;
  padding:5px 7px;
  font-size:13px;
  font-family:inherit;
}
.scorer-add-row{ display:flex; gap:6px; margin-bottom:6px; }
.scorer-add-row select{
  flex:1;
  min-width:0;
  border:1px solid var(--riga);
  border-radius:7px;
  padding:5px 6px;
  font-size:12px;
  font-family:inherit;
  background:var(--carta);
}
.scorer-add-row input{
  width:48px;
  border:1px solid var(--riga);
  border-radius:7px;
  padding:5px 6px;
  font-size:12px;
  font-family:inherit;
}
.add-scorer-btn{
  flex:none;
  font-size:11.5px;
  font-weight:700;
  color:#fff;
  background:var(--campo);
  border:none;
  border-radius:7px;
  padding:5px 10px;
  cursor:pointer;
}
.scorer-chips{ display:flex; flex-wrap:wrap; gap:5px; }
.scorer-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:600;
  background:var(--verde-chiaro,#eef3ec);
  color:var(--campo-deep);
  padding:3px 4px 3px 9px;
  border-radius:12px;
}
.scorer-chip button{
  border:none;
  background:none;
  color:var(--inchiostro-soft);
  font-size:13px;
  line-height:1;
  cursor:pointer;
  padding:0 4px;
}
.editor-actions{ display:flex; gap:8px; margin-top:10px; }
.save-result-btn, .cancel-result-btn{
  flex:1;
  font-size:12.5px;
  font-weight:700;
  border-radius:9px;
  padding:9px 0;
  border:none;
  cursor:pointer;
}
.save-result-btn{ background:var(--campo); color:#fff; }
.cancel-result-btn{ background:var(--riga); color:var(--inchiostro-soft); }

/* Eventi extra: amichevoli (verdino) e tornei (rossino) */
.match-result-row.tipo-amichevole{ background:#eef7ef; border-left:3px solid #4a9d5c; margin:0 -14px; padding:12px 14px; }
.match-result-row.tipo-torneo{ background:#fbeeee; border-left:3px solid #c25a5a; margin:0 -14px; padding:12px 14px; }
.mrr-actions{ display:flex; align-items:center; gap:6px; flex:none; }
.delete-evento-btn{
  border:none;
  background:var(--riga);
  color:var(--inchiostro-soft);
  width:22px; height:22px;
  border-radius:50%;
  font-size:14px;
  line-height:1;
  cursor:pointer;
}
.legend-row{ display:flex; gap:14px; padding:0 14px 10px; font-size:11px; color:var(--inchiostro-soft); }
.legend-item{ display:flex; align-items:center; gap:5px; }
.legend-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.legend-dot.tipo-amichevole{ background:#4a9d5c; }
.legend-dot.tipo-torneo{ background:#c25a5a; }

.torneo-partita-block{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--riga); }
.torneo-partita-block:first-child{ margin-top:0; padding-top:0; border-top:none; }
.torneo-partita-head{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700; margin-bottom:4px; }
.torneo-partita-edit-head{ font-size:12.5px; font-weight:800; color:var(--campo-deep); margin:12px 0 4px; padding-top:10px; border-top:1px solid var(--riga); }
.torneo-partita-edit-head:first-child{ margin-top:0; padding-top:0; border-top:none; }

.add-evento-row{ padding:12px 14px 14px; }
.add-evento-row button{
  width:100%;
  font-size:12.5px;
  font-weight:700;
  color:var(--campo-deep);
  background:var(--verde-chiaro,#eef3ec);
  border:1px dashed var(--campo);
  border-radius:9px;
  padding:10px 0;
  cursor:pointer;
}
.nuovo-evento-form{ padding:4px 14px 14px; }
.form-field{ margin-bottom:9px; }
.form-field label{ display:block; font-size:11.5px; color:var(--inchiostro-soft); margin-bottom:3px; font-weight:600; }
.form-field input, .form-field select{
  width:100%;
  border:1px solid var(--riga);
  border-radius:8px;
  padding:7px 9px;
  font-size:13px;
  font-family:inherit;
  background:var(--carta);
}
.form-partita-row{ display:flex; gap:6px; margin-bottom:6px; }
.form-partita-row .nf-partita-titolo{ flex:3; border:1px solid var(--riga); border-radius:8px; padding:6px 8px; font-size:12.5px; font-family:inherit; }
.form-partita-row .nf-partita-numtempi{ flex:1; width:50px; border:1px solid var(--riga); border-radius:8px; padding:6px 8px; font-size:12.5px; font-family:inherit; }

/* ---------- Conflitti ---------- */
.settings-box{
  background:var(--carta);
  border:1px solid var(--riga);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:16px;
}
.settings-box .settings-title{
  font-size:11.5px;
  font-weight:700;
  color:var(--inchiostro-soft);
  margin-bottom:8px;
}
.settings-row{
  display:flex;
  gap:14px;
}
.settings-field{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.settings-field label{
  font-size:11px;
  color:var(--inchiostro-soft);
}
.settings-field .input-wrap{
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--riga);
  border-radius:8px;
  padding:5px 8px;
}
.settings-field input{
  width:100%;
  border:none;
  outline:none;

   2. Nel menu laterale apri "Firestore Database" > "Crea database" > scegli una regione
      vicina (es. europe-west) > parti in modalità test.
   3. Vai su "Regole" (Rules) nel database e sostituisci tutto con:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /trevigliese/{docId} {
              allow read, write: if true;
            }
            match /push_tokens/{docId} {
              allow read, write: if true;

        }
      (altrimenti la modalità test si blocca da sola dopo 30 giorni. push_tokens serve perché il
       browser scrive direttamente il token di notifica; notifiche_inviate la scrive solo lo
       script server-side con l'account di servizio, che bypassa comunque le regole, ma teniamola
       aperta per semplicità visto che non contiene dati sensibili)
   4. Nel menu in alto a sinistra, icona a forma di ingranaggio > "Impostazioni progetto" >
      scorri fino a "Le tue app" > icona "</>" (Web) > registra una app (basta un nome) >

// Caricamento "dinamico" e protetto: se la rete blocca gstatic.com (es. anteprime in
// sandbox) o le chiavi sono ancora i placeholder, l'app continua a funzionare lo stesso

let db = null;
let firebaseAttivo = false;
let RISULTATI_DOC = null;
let fsGetDoc = null, fsSetDoc = null, fsServerTimestamp = null;

// Chiave pubblica "VAPID" per le notifiche push — da generare su:
// Console Firebase > Impostazioni progetto > Cloud Messaging > Web Push certificates > Genera coppia di chiavi.
// Non è segreta allo stesso modo di una password, ma è specifica del progetto: senza la tua
// non puoi ricevere notifiche sul tuo progetto Firebase.
const VAPID_KEY = "BJeAqubuKs0suC-ll54foFIDoCe4Ztx3k-kmQId6a2Am51WIdzuqfbElSbOEgOTQ2_9468mgSobN-5G95nUMQoA";

let fbMessaging = null;
let messagingAttivo = false;
let fsCollection=null, fsAddDoc=null, fsSetDocMerge=null;

async function initFirebase(){
  try {
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const fsMod  = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const fbApp = appMod.initializeApp(firebaseConfig);
    db = fsMod.getFirestore(fbApp);
    RISULTATI_DOC = fsMod.doc(db, "trevigliese", "risultati");
    fsGetDoc = fsMod.getDoc;
    fsSetDoc = fsMod.setDoc;
    fsServerTimestamp = fsMod.serverTimestamp;
    fsCollection = fsMod.collection;
    fsAddDoc = fsMod.addDoc;
    firebaseAttivo = true;

    // Messaging è opzionale: se il browser non lo supporta (o il VAPID key non è
    // ancora stato configurato), l'app funziona comunque, solo senza notifiche.
    try {
      const msgMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");
      const supportata = await msgMod.isSupported();
      if (supportata){
        fbMessaging = msgMod.getMessaging(fbApp);
        window.__fcmGetToken = (reg) => msgMod.getToken(fbMessaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
        msgMod.onMessage(fbMessaging, (payload)=>{
          const title = (payload.notification && payload.notification.title) || 'Football Planner PRO';
          const body = (payload.notification && payload.notification.body) || '';
          alert(`${title}\n${body}`); // app in primo piano: niente notifica di sistema, basta un avviso semplice
        });
        messagingAttivo = true;
      }
    } catch(e){
      console.warn('Firebase Messaging non disponibile in questo ambiente.', e);
    }
  } catch(e){
    console.warn('Firebase non disponibile in questo ambiente — i dati restano solo in questa sessione.', e);
    firebaseAttivo = false;
  }
}

function mapsUrl(m){ return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.addr+' '+m.place)}`; }

function daysUntil(d, now){
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((b-a)/86400000);
}

function badge(catKey, size){
  const t = TEAMS[catKey];
  return `<span class="badge" style="background:${t.color};${size?`width:${size}px;height:${size}px;font-size:${size*0.42}px;`:''}">${t.short}</span>`;

let notifStatus = 'idle'; // 'idle' | 'attivo'

function renderNotifCard(){
  const el = document.getElementById('notif-card');
  if (!el) return;

  if (typeof Notification === 'undefined' || !messagingAttivo){
    el.innerHTML = '';
    return;
  }

  const perm = Notification.permission;
  if (perm === 'granted' && notifStatus === 'attivo'){
    el.innerHTML = `<div class="notif-card ok">Promemoria attivi su questo dispositivo.</div>`;
    return;
  }
  if (perm === 'denied'){
    el.innerHTML = `<div class="notif-card warn">Notifiche bloccate per questo sito — per riattivarle devi sbloccarle dalle impostazioni del browser.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="notif-card">
      <span>Vuoi un promemoria push 24 ore prima di ogni partita?</span>
      <button type="button" id="attiva-notifiche-btn">Attiva promemoria</button>
    </div>
  `;
  const btn = document.getElementById('attiva-notifiche-btn');
  if (btn) btn.addEventListener('click', abilitaNotifiche);
}

async function abilitaNotifiche(){
  try {
    if (!('serviceWorker' in navigator)){
      alert('Questo browser non supporta le notifiche push.');
      return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){ renderNotifCard(); return; }

    const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    const token = await window.__fcmGetToken(reg);
    if (!token){
      alert('Non sono riuscito a generare il token per le notifiche. Riprova più tardi.');
      return;
    }
    if (firebaseAttivo && fsCollection && fsAddDoc){
      await fsAddDoc(fsCollection(db, 'push_tokens'), { token, creato: new Date().toISOString() });
    }
    notifStatus = 'attivo';
    renderNotifCard();
  } catch(e){
    console.error('Errore attivazione notifiche:', e);
    alert('Non sono riuscito ad attivare le notifiche su questo dispositivo/browser.');
  }
}

function matchKey(m){ return m.cat + '|' + m.date; }

function nextMatchKeys(now){
  const nowT = now.getTime();
  const keys = new Set();
  Object.keys(TEAMS).forEach(cat=>{
    const next = matches.filter(m=>m.cat===cat)
      .map(m=>({...m, dt:new Date(m.date)}))
      .filter(m=>m.dt.getTime()+2*3600000 > nowT)
      .sort((a,b)=>a.dt-b.dt)[0];
    if (next) keys.add(matchKey(next));
  });
  return keys;
}

// Rosa Pulcini 2017
const PLAYERS = [
  "Berardi Tommaso","Campaore Rayan","Frigerio Samuele","Fumagalli Riccardo",
  "Giombelli Nicholas","Giordano Mattia","Kamal Joussef","Mayer Nicolò",
  "Miedico Federico","Mihaila Paul","Owoosu Jeremi","Piscitelli Edoardo",
  "Tahrir Yassine","Tarar Shazam","Zangari Tommaso"
];

const MIO_FIGLIO = "Giordano Mattia";
function isMioFiglio(name){ return name === MIO_FIGLIO; }
function playerLabel(name){ return isMioFiglio(name) ? `<span class="mio-figlio">${name}</span>` : name; }

// Cache in memoria: tutte le funzioni di calcolo/rendering restano SINCRONE e leggono
// da qui. All'avvio la popoliamo da Firestore (asincrono); ogni salvataggio aggiorna
// prima la cache (così l'interfaccia è sempre immediata) e poi scrive sul cloud in
// background. Se Firestore non è configurato o la rete è assente, la cache resta
// comunque utilizzabile per la sessione corrente — l'app non si blocca mai.
let resultsCache = {};
let cloudStatus = 'loading'; // 'loading' | 'synced' | 'offline' | 'error'

async function caricaRisultatiDalCloud(){
  if (!firebaseAttivo){
    cloudStatus = 'offline';
    return;
  }
  try {
    const snap = await fsGetDoc(RISULTATI_DOC);
    resultsCache = snap.exists() ? (snap.data().data || {}) : {};
    cloudStatus = 'synced';
  } catch(e){
    console.error('Errore caricamento risultati da Firestore:', e);
    cloudStatus = 'error';
  }
  // se l'utente è già sul tab Classifiche > Trevigliese, aggiorna la vista coi dati freschi
  const chipAttiva = document.querySelector('#standings-chips .chip.active');
  if (chipAttiva && chipAttiva.dataset.sfilter==='mattia'){
    renderMattiaStandings();
  }
}

function loadAllResults(){ return resultsCache; }

function saveAllResults(all){
  resultsCache = all;
  if (!firebaseAttivo){ cloudStatus='offline'; return; }
  fsSetDoc(RISULTATI_DOC, { data: all, updatedAt: fsServerTimestamp() })
    .then(()=>{ cloudStatus='synced'; })
    .catch(e=>{
      cloudStatus='error';
      console.error('Errore salvataggio su Firestore:', e);
      alert('Il salvataggio sul cloud non è riuscito (controlla la connessione). La modifica resta visibile in questa sessione ma non è ancora al sicuro — riprova a salvare.');
    });
}
function matchKeyFor(m){ return 'g' + m.giornata; }
function emptyTempi(){ return [0,1,2,3].map(()=>({ against:'', scorers:[] })); }
function getMatchData(key){
  const all = loadAllResults();
  const d = all[key];
  if (!d || !d.tempi) return { tempi: emptyTempi() };
  while (d.tempi.length < 4) d.tempi.push({ against:'', scorers:[] });
  return d;
}
function setMatchData(key, data){
  const all = loadAllResults();
  all[key] = data;
  saveAllResults(all);
}

function tempoGolFatti(t){ return (t.scorers||[]).reduce((s,x)=>s+Number(x.goals||0),0); }
function tempoGiocato(t){ return t.against !== '' && t.against !== null && t.against !== undefined && !isNaN(Number(t.against)); }
function tempoEsito(t){
  const f = tempoGolFatti(t), a = Number(t.against);
  if (f>a) return 'V';
  if (f<a) return 'S';
  return 'P';
}
function esitoDaConteggio(v,s){ if (v>s) return 'V'; if (s>v) return 'S'; return 'P'; }

// Calcola risultato aggregato "primi N tempi" di una partita (N=3 o N=4)
function calcolaAggregato(tempi, n){
  const slice = tempi.slice(0,n);
  let golFatti=0, golSubiti=0, v=0, p=0, s=0, punti=0, giocati=0;
  slice.forEach(t=>{
    if (!tempoGiocato(t)) return;
    giocati++;
    const f = tempoGolFatti(t), a = Number(t.against);
    golFatti+=f; golSubiti+=a;
    const e = tempoEsito(t);
    if (e==='V'){ v++; punti+=1; } else if (e==='P'){ p++; punti+=1; } else { s++; }
  });
  if (giocati===0) return null;
  return { golFatti, golSubiti, esito: esitoDaConteggio(v,s), punti, giocati, v, p, s };
}

function calcolaMatch(data){
  return { tre: calcolaAggregato(data.tempi,3), quattro: calcolaAggregato(data.tempi,4) };
}

function calcolaClassificaSquadra(mattiaMatches){
  let punti3=0, punti4=0, giornateGiocate=0;
  mattiaMatches.forEach(m=>{
    const data = getMatchData(matchKeyFor(m));
    const r = calcolaMatch(data);
    if (r.tre) punti3 += r.tre.punti;
    if (r.quattro) punti4 += r.quattro.punti;
    if (r.tre || r.quattro) giornateGiocate++;
  });
  return { punti3, punti4, giornateGiocate };
}

// soloCampionato=true -> conta solo le 9 giornate ufficiali; false -> anche amichevoli/tornei aggiunti a mano
function calcolaMarcatori(mattiaMatches, soloCampionato){
  const totals = {};
  PLAYERS.forEach(p=> totals[p] = { goals:0, dettagli:[] });
  mattiaMatches.forEach(m=>{
    const data = getMatchData(matchKeyFor(m));
    data.tempi.forEach((t,idx)=>{
      (t.scorers||[]).forEach(sc=>{
        if (!totals[sc.name]) totals[sc.name] = { goals:0, dettagli:[] };
        const g = Number(sc.goals||0);
        totals[sc.name].goals += g;
        if (g>0) totals[sc.name].dettagli.push({ giornata:m.giornata, tempo:idx+1, goals:g, title:m.title });
      });
    });
  });
  if (!soloCampionato){
    getExtraEventi().forEach(ev=>{
      ev.partite.forEach((p,pi)=>{
        p.tempi.forEach((t,idx)=>{
          (t.scorers||[]).forEach(sc=>{
            if (!totals[sc.name]) totals[sc.name] = { goals:0, dettagli:[] };
            const g = Number(sc.goals||0);
            totals[sc.name].goals += g;
            if (g>0) totals[sc.name].dettagli.push({ giornata:null, tempo:idx+1, goals:g, title: ev.partite.length>1 ? `${ev.titolo} — ${p.titolo}` : ev.titolo });
          });
        });
      });
    });
  }
  return totals;
}

/* ---- Eventi extra: amichevoli e tornei aggiunti manualmente ---- */
function getExtraEventi(){
  if (!resultsCache.extra) resultsCache.extra = [];
  return resultsCache.extra;
}
function getEventoById(id){ return getExtraEventi().find(e=>e.id===id); }
function emptyTempiN(n){ return Array.from({length:Math.max(1,n)}, ()=>({ against:'', scorers:[] })); }

function creaEvento(bozza){
  const extra = getExtraEventi();
  let partite;
  if (bozza.tipo==='amichevole'){
    partite = [{ titolo: bozza.titolo || 'Amichevole', tempi: emptyTempiN(bozza.numTempi) }];
  } else {
    partite = bozza.partite.map((p,i)=>({ titolo: p.titolo || `Partita ${i+1}`, tempi: emptyTempiN(p.numTempi) }));
  }
  const evento = {
    id: 'extra-' + Date.now(),
    tipo: bozza.tipo,
    titolo: bozza.titolo || (bozza.tipo==='amichevole' ? 'Amichevole' : 'Torneo'),
    data: bozza.data || '',
    ora: bozza.ora || '',
    partite
  };
  extra.push(evento);
  saveAllResults(resultsCache);
  return evento;
}
function eliminaEvento(id){
  resultsCache.extra = getExtraEventi().filter(e=>e.id!==id);
  saveAllResults(resultsCache);
}

// stato dell'editor (solo una partita/evento apribile alla volta, modifiche "in bozza" fino al Salva)
let openMatchKey = null;
let openDetailKey = null;
let editBuffer = {};
let nuovoEventoForm = null;
let marcatoriSoloCampionato = false;

// Rappresentazione unificata: ogni "voce" (partita di campionato, amichevole, torneo)
// viene normalizzata in { partite: [ {titolo, tempi, libero} ] } per riusare lo stesso
// editor e la stessa vista di dettaglio ovunque.
function ensureBuffer(key){
  if (!editBuffer[key]){
    if (key.startsWith('extra-')){
      const ev = getEventoById(key);
      editBuffer[key] = {
        tipo: ev.tipo,
        partite: ev.partite.map(p=>({ titolo:p.titolo, tempi: JSON.parse(JSON.stringify(p.tempi)), libero:false }))
      };
    } else {
      const stored = getMatchData(key);
      editBuffer[key] = {
        tipo: 'campionato',
        partite: [{ titolo:null, tempi: JSON.parse(JSON.stringify(stored.tempi)), libero:true }]
      };
    }
  }
  return editBuffer[key];
}
function salvaBuffer(key){
  const buf = editBuffer[key];
  if (buf.tipo==='campionato'){
    setMatchData(key, { tempi: buf.partite[0].tempi });
  } else {
    const ev = getEventoById(key);
    ev.partite = buf.partite.map(p=>({ titolo:p.titolo, tempi:p.tempi }));
    saveAllResults(resultsCache);
  }
  delete editBuffer[key];
}

function wireBackupControls(){
  const exportBtn = document.getElementById('export-results-btn');
  if (exportBtn){
    exportBtn.addEventListener('click',()=>{
      const data = JSON.stringify(loadAllResults(), null, 2);
      const blob = new Blob([data], { type:'application/json' });
      const urlObj = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = urlObj;
      a.download = 'trevigliese-risultati-backup.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(urlObj);
    });
  }
  const importInput = document.getElementById('import-results-input');
  if (importInput){
    importInput.addEventListener('change',(ev)=>{
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try {
          const parsed = JSON.parse(reader.result);
          saveAllResults(parsed);
          renderMattiaStandings();
        } catch(e){
          alert('File non valido: non sembra un backup esportato da questa app.');
        }
      };
      reader.readAsText(file);
    });
  }
}

// Dettaglio di UNA partita (singola, non torneo): righe tempo per tempo con risultato e marcatori
function tempiDettaglioHtml(partita){
  return partita.tempi.map((t,idx)=>{
    const label = `Tempo ${idx+1}${partita.libero && idx===3 ? ' (libero)' : ''}`;

      return `<div class="tempo-detail-row"><span class="tdr-label">${label}</span><span class="tdr-score tdr-none">non giocato</span></div>`;
    }
    const f = tempoGolFatti(t), a = Number(t.against), e = tempoEsito(t);
    const scorerNames = (t.scorers||[]).filter(sc=>sc.goals>0).map(sc=> sc.goals>1 ? `${playerLabel(sc.name)} (${sc.goals})` : playerLabel(sc.name)).join(', ');

    `;
  }).join('');
}

// Dettaglio di un evento intero: una partita sola (campionato/amichevole) o più (torneo)
function dettaglioEventoHtml(partite){
  if (partite.length===1) return tempiDettaglioHtml(partite[0]);
  return partite.map((p,pi)=>{
    const agg = calcolaAggregato(p.tempi, p.tempi.length);
    const chip = agg
      ? `<span class="risultato-chip ${esitoClass(agg.esito)}">${agg.golFatti}-${agg.golSubiti} (${agg.esito})</span>`
      : `<span class="risultato-chip esito-none">da giocare</span>`;
    return `
      <div class="torneo-partita-block">
        <div class="torneo-partita-head"><span>${p.titolo}</span>${chip}</div>
        ${tempiDettaglioHtml(p)}
      </div>
    `;
  }).join('');
}

// Data "effettiva" di una voce, per ordinare campionato + extra nella stessa lista.
// Un evento extra senza data indicata viene collocato alla data di creazione (oggi),
// così resta comunque in posizione sensata invece di finire sempre in coda.
function dataVoce(voce){
  if (voce.tipo==='campionato') return new Date(voce.m.date);
  if (voce.ev.data) return new Date(voce.ev.data + 'T' + (voce.ev.ora || '12:00') + ':00');
  const ts = Number(voce.ev.id.split('-')[1]);
  return isNaN(ts) ? new Date() : new Date(ts);
}

function getPartiteNormalizzate(voce){
  if (voce.tipo==='campionato'){
    const data = getMatchData(voce.key);
    return [{ titolo: voce.m.title, tempi: data.tempi, libero:true }];
  }
  return voce.ev.partite.map(p=>({ titolo:p.titolo, tempi:p.tempi, libero:false }));
}

function vociRowHtml(voce){
  const key = voce.key;
  const isOpen = openMatchKey===key;
  const isDetailOpen = openDetailKey===key;
  const partite = getPartiteNormalizzate(voce);

  let titolo, sottotitolo, chipsHtml, tipoClass = '';

  if (voce.tipo==='campionato'){
    const r = calcolaMatch(getMatchData(key));
    const chip = (agg,label) => agg
      ? `<span class="risultato-chip ${esitoClass(agg.esito)}">${label}: ${agg.golFatti}-${agg.golSubiti} (${agg.esito})</span>`
      : `<span class="risultato-chip esito-none">${label}: da giocare</span>`;
    titolo = voce.m.title;
    sottotitolo = `G${voce.m.giornata}`;
    chipsHtml = chip(r.tre,'3T') + chip(r.quattro,'4T');
  } else {
    const ev = voce.ev;
    tipoClass = ev.tipo==='amichevole' ? 'tipo-amichevole' : 'tipo-torneo';
    titolo = ev.titolo;
    sottotitolo = (ev.tipo==='amichevole' ? 'Amichevole' : 'Torneo') + (ev.data ? ` · ${ev.data}` : '') + (ev.ora ? ` ${ev.ora}` : '');
    if (ev.partite.length===1){
      const agg = calcolaAggregato(ev.partite[0].tempi, ev.partite[0].tempi.length);
      chipsHtml = agg
        ? `<span class="risultato-chip ${esitoClass(agg.esito)}">${agg.golFatti}-${agg.golSubiti} (${agg.esito})</span>`
        : `<span class="risultato-chip esito-none">da giocare</span>`;
    } else {
      let v=0,p=0,s=0,giocate=0;
      ev.partite.forEach(part=>{
        const agg = calcolaAggregato(part.tempi, part.tempi.length);
        if (agg){ giocate++; if(agg.esito==='V') v++; else if(agg.esito==='P') p++; else s++; }
      });
      chipsHtml = giocate>0
        ? `<span class="risultato-chip esito-p">${giocate}/${ev.partite.length} partite — ${v}V ${p}P ${s}S</span>`
        : `<span class="risultato-chip esito-none">${ev.partite.length} partite — da giocare</span>`;
    }
  }

  return `
    <div class="match-result-row ${tipoClass}">
      <div class="mrr-head">
        <div class="mrr-info" data-detail-key="${key}">
          <span class="mrr-giornata">${sottotitolo}</span>
          <span class="mrr-title">${titolo}</span>
        </div>
        <div class="mrr-actions">
          ${voce.tipo!=='campionato' ? `<button type="button" class="delete-evento-btn" data-key="${key}" title="Elimina">×</button>` : ''}
          <button type="button" class="edit-toggle-btn" data-key="${key}">${isOpen ? 'Chiudi' : 'Modifica'}</button>
        </div>
      </div>
      <div class="mrr-chips" data-detail-key="${key}">${chipsHtml}</div>
      ${isDetailOpen ? `<div class="tempo-detail">${dettaglioEventoHtml(partite)}</div>` : ''}
      ${isOpen ? editorEventoHtml(key) : ''}
    </div>
  `;
}

    const forGoals = tempoGolFatti(t);
    return `
      <div class="tempo-edit-row">

          <span>Tempo ${idx+1}${partita.libero && idx===3 ? ' <span class="tempo-free-tag">libero</span>' : ''}</span>

function editorEventoHtml(key){
  const buf = ensureBuffer(key);
  const corpo = buf.partite.map((partita,pi)=>`

function wireResultsList(){
  document.querySelectorAll('[data-detail-key]').forEach(el=>{
    el.addEventListener('click',()=>{
      const key = el.dataset.detailKey;
      openDetailKey = (openDetailKey===key) ? null : key;

    });
  });

  document.querySelectorAll('.edit-toggle-btn').forEach(btn=>{
    btn.addEventListener('click',(ev)=>{
      ev.stopPropagation();
      const key = btn.dataset.key;
      openMatchKey = (openMatchKey===key) ? null : key;
      if (openMatchKey) ensureBuffer(openMatchKey);
      renderMattiaStandings();
    });
  });

  document.querySelectorAll('.delete-evento-btn').forEach(btn=>{
    btn.addEventListener('click',(ev)=>{
      ev.stopPropagation();

        renderMattiaStandings();
      }
    });
  });

  document.querySelectorAll('.tempo-against-input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const buf = ensureBuffer(inp.dataset.key);
      buf.partite[inp.dataset.pi].tempi[inp.dataset.idx].against = inp.value;
    });
  });

  document.querySelectorAll('.add-scorer-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key = btn.dataset.key, pi = Number(btn.dataset.pi), idx = Number(btn.dataset.idx);
      const row = btn.closest('.tempo-edit-row');
      const select = row.querySelector('.scorer-select');
      const goalsInput = row.querySelector('.scorer-goals-input');
      const goals = Number(goalsInput.value) || 1;
      const buf = ensureBuffer(key);
      buf.partite[pi].tempi[idx].scorers.push({ name: select.value, goals });
      renderMattiaStandings();
    });
  });

  document.querySelectorAll('.remove-scorer-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key = btn.dataset.key, pi = Number(btn.dataset.pi), idx = Number(btn.dataset.idx), si = Number(btn.dataset.si);
      const buf = ensureBuffer(key);
      buf.partite[pi].tempi[idx].scorers.splice(si,1);
      renderMattiaStandings();
    });
  });

  document.querySelectorAll('.save-result-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key = btn.dataset.key;
      salvaBuffer(key);
      openMatchKey = null;
      renderMattiaStandings();
    });
  });

  document.querySelectorAll('.cancel-result-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key = btn.dataset.key;
      delete editBuffer[key];
      openMatchKey = null;
      renderMattiaStandings();
    });
  });
}

    <div class="form-field">
      <label>Titolo</label>
      <input type="text" id="nf-titolo" placeholder="${f.tipo==='amichevole' ? 'es. vs Oratorio San Pietro' : 'es. Torneo di Primavera'}" value="${f.titolo}">
    </div>
    <div class="form-field">
      <label>Data (opzionale)</label>
      <input type="date" id="nf-data" value="${f.data}">
    </div>
    <div class="form-field">
      <label>Ora (opzionale, serve per il promemoria 24h prima)</label>
      <input type="time" id="nf-ora" value="${f.ora}">
    </div>
  `;

  let corpoSpecifico;
  if (f.tipo==='amichevole'){
    corpoSpecifico = `
      <div class="form-field">
        <label>Numero di tempi</label>
        <input type="number" min="1" max="10" id="nf-numtempi" value="${f.numTempi}">
      </div>
    `;
  } else {
    corpoSpecifico = `
      <div class="form-field">
        <label>Numero di partite</label>
        <input type="number" min="1" max="12" id="nf-numpartite" value="${f.partite.length}">
      </div>
      <div id="nf-partite-list">
        ${f.partite.map((p,i)=>`
          <div class="form-partita-row">
            <input type="text" placeholder="Partita ${i+1} (es. vs Squadra X)" class="nf-partita-titolo" data-i="${i}" value="${p.titolo}">
            <input type="number" min="1" max="10" class="nf-partita-numtempi" data-i="${i}" value="${p.numTempi}">
          </div>
        `).join('')}
      </div>
    `;
  }

  return `
    <div class="nuovo-evento-form">
      ${campiComuni}
      ${corpoSpecifico}
      <div class="editor-actions">
        <button type="button" class="save-result-btn" id="nf-crea-btn">Crea evento</button>
        <button type="button" class="cancel-result-btn" id="nf-annulla-btn">Annulla</button>
      </div>
    </div>
  `;
}

function wireNuovoEventoForm(){
  const apriBtn = document.getElementById('apri-nuovo-evento-btn');
  if (apriBtn) apriBtn.addEventListener('click', ()=>{ nuovoEventoForm = nuovoEventoDefault(); renderMattiaStandings(); });

  const tipoSel = document.getElementById('nf-tipo');
  if (tipoSel) tipoSel.addEventListener('change', ()=>{ nuovoEventoForm.tipo = tipoSel.value; renderMattiaStandings(); });

  const titoloInp = document.getElementById('nf-titolo');
  if (titoloInp) titoloInp.addEventListener('input', ()=>{ nuovoEventoForm.titolo = titoloInp.value; });

  const dataInp = document.getElementById('nf-data');
  if (dataInp) dataInp.addEventListener('input', ()=>{ nuovoEventoForm.data = dataInp.value; });

  const oraInp = document.getElementById('nf-ora');
  if (oraInp) oraInp.addEventListener('input', ()=>{ nuovoEventoForm.ora = oraInp.value; });

  const numTempiInp = document.getElementById('nf-numtempi');
  if (numTempiInp) numTempiInp.addEventListener('input', ()=>{ nuovoEventoForm.numTempi = Number(numTempiInp.value)||1; });

  const numPartiteInp = document.getElementById('nf-numpartite');
  if (numPartiteInp) numPartiteInp.addEventListener('change', ()=>{
    const n = Math.max(1, Number(numPartiteInp.value)||1);
    const partite = nuovoEventoForm.partite;
    while (partite.length < n) partite.push({ titolo:'', numTempi:2 });
    partite.length = n;
    renderMattiaStandings();
  });

  document.querySelectorAll('.nf-partita-titolo').forEach(inp=>{
    inp.addEventListener('input', ()=>{ nuovoEventoForm.partite[inp.dataset.i].titolo = inp.value; });
  });
  document.querySelectorAll('.nf-partita-numtempi').forEach(inp=>{
    inp.addEventListener('input', ()=>{ nuovoEventoForm.partite[inp.dataset.i].numTempi = Number(inp.value)||1; });
  });

  const creaBtn = document.getElementById('nf-crea-btn');
  if (creaBtn) creaBtn.addEventListener('click', ()=>{
    const evento = creaEvento(nuovoEventoForm);
    nuovoEventoForm = null;
    openMatchKey = evento.id;
    ensureBuffer(evento.id);
    renderMattiaStandings();
  });

  const annullaBtn = document.getElementById('nf-annulla-btn');
  if (annullaBtn) annullaBtn.addEventListener('click', ()=>{ nuovoEventoForm = null; renderMattiaStandings(); });
}

/* ============== CONFLITTI ============== */
// Durata effettiva delle due partite "mie" (non il campionato di Mattia, che non gioco io)
const DURATA = {
  c7:  { tempo:25, intervallo:5 },   // 25+5+25 = 55'
  c11: { tempo:40, intervallo:5 }    // 40+5+40 = 85'
};

function addMin(date, min){ return new Date(date.getTime() + min*60000); }

function finestraPartita(m){
  const d = DURATA[m.cat];
  const start = new Date(m.date);
  const t1End = addMin(start, d.tempo);
  const t2Start = addMin(t1End, d.intervallo);
  const end = addMin(t2Start, d.tempo);
  return { ...m, start, t1End, t2Start, end, tempo:d.tempo, intervallo:d.intervallo, totale:d.tempo*2+d.intervallo };
}

function fmtOra(d){ return d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }
function fmtData(d){ return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI_LUNGHI[d.getMonth()]}`; }

// Descrive "a che punto della partita a7" cade un certo minuto trascorso dal fischio d'inizio
function classificaMomento(minuti, tempo, intervallo){
  if (minuti <= 0) return "prima del fischio d'inizio";
  if (minuti < tempo) return `durante il primo tempo (minuto ${Math.round(minuti)}')`;
  if (minuti < tempo+intervallo) return `durante l'intervallo`;
  if (minuti < tempo*2+intervallo) return `durante il secondo tempo (minuto ${Math.round(minuti-tempo-intervallo)}')`;
  return `a fine partita`;
}

function getConflitti(travelMin, contingencyMin){
  const buffer = travelMin + contingencyMin; // minuti di "cuscinetto" necessari per lo spostamento
  const c7List  = matches.filter(m=>m.cat==='c7').map(finestraPartita);
  const c11List = matches.filter(m=>m.cat==='c11').map(finestraPartita);
  const conflitti = [];

  c7List.forEach(a=>{
    c11List.forEach(b=>{
      // conflitto se non c'è abbastanza margine tra la fine di una e l'inizio dell'altra, in nessuno dei due ordini
      const bufferMs = buffer*60000;
      const abbastanzaTempoAB = (a.end.getTime() + bufferMs) <= b.start.getTime();
      const abbastanzaTempoBA = (b.end.getTime() + bufferMs) <= a.start.getTime();
      if (!abbastanzaTempoAB && !abbastanzaTempoBA){
        const overlapStart = new Date(Math.max(a.start.getTime(), b.start.getTime()));
        const overlapEnd = new Date(Math.min(a.end.getTime(), b.end.getTime()));
        const overlapMin = Math.max(0, Math.round((overlapEnd-overlapStart)/60000));
        conflitti.push({ c7:a, c11:b, overlapMin });
      }
    });
  });
  return conflitti.sort((x,y)=>x.c7.start-y.c7.start);
}

// Opzione 1: gioco con la squadra a7 e poi mi sposto per Over40 — a che punto devo uscire?
function suggerimentoOpzione1(c7m, c11m, travelMin, contingencyMin){
  const buffer = travelMin + contingencyMin;
  const gapInizio = (c11m.start.getTime() - c7m.start.getTime())/60000;
  const maxPerInizio = gapInizio - buffer;

  if (maxPerInizio >= c7m.totale){
    return `Gioca tutta la partita a7 (fino alle ${fmtOra(c7m.end)}): hai comunque il tempo di arrivare per il fischio d'inizio di Over40 alle ${fmtOra(c11m.start)}.`;
  }
  if (maxPerInizio > 0){
    const leaveTime = addMin(c7m.start, maxPerInizio);
    const momento = classificaMomento(maxPerInizio, c7m.tempo, c7m.intervallo);
    return `Esci dal campo a7 ${momento} — entro le ${fmtOra(leaveTime)} — e arrivi in tempo per il fischio d'inizio di Over40 (${fmtOra(c11m.start)}).`;
  }

  // non arrivi per il fischio d'inizio: calcola il massimo per arrivare prima del 2° tempo di Over40
  const secondoTempoOver40 = c11m.t2Start;
  const maxPer2Tempo = (secondoTempoOver40.getTime() - c7m.start.getTime())/60000 - buffer;
  if (maxPer2Tempo <= 0){
    return `Con questi tempi di spostamento non arrivi nemmeno per l'inizio del secondo tempo di Over40 (${fmtOra(secondoTempoOver40)}). In questo caso l'Opzione 2 è la scelta più realistica.`;
  }
  const cap = Math.min(maxPer2Tempo, c7m.totale);
  const leaveTime2 = addMin(c7m.start, cap);
  const momento2 = classificaMomento(cap, c7m.tempo, c7m.intervallo);
  return `Non arrivi per il fischio d'inizio di Over40 (${fmtOra(c11m.start)}), ma restando a7 ${momento2} — fino alle ${fmtOra(leaveTime2)} — arrivi giusto in tempo per l'inizio del secondo tempo di Over40 (${fmtOra(secondoTempoOver40)}).`;
}

function renderConflicts(){
  const travelMin = parseFloat(document.getElementById('travel-min').value) || 0;
  const contingencyMin = parseFloat(document.getElementById('contingency-min').value) || 0;
  const conflitti = getConflitti(travelMin, contingencyMin);
  const container = document.getElementById('conflicts-list');

  if (conflitti.length===0){
    container.innerHTML = `<div class="empty-state">Nessun conflitto rilevato con questi tempi di spostamento. Se li riduci potresti scoprirne qualcuno nascosto, se li aumenti qualcuno potrebbe sparire.</div>`;
    return;
  }

  container.innerHTML = conflitti.map(({c7:a, c11:b, overlapMin})=>{
    const opt1 = suggerimentoOpzione1(a, b, travelMin, contingencyMin);
    const overlapText = overlapMin > 0
      ? `${overlapMin}' di sovrapposizione diretta`
      : `nessun minuto di sovrapposizione, ma margine insufficiente per lo spostamento`;
    return `
      <div class="conflict-card">
        <div class="conflict-head">
          <span class="cdate">${fmtData(a.start).charAt(0).toUpperCase()+fmtData(a.start).slice(1)}</span>
          <span class="coverlap">${overlapText}</span>
        </div>
        <div class="conflict-matches">
          <div class="conflict-match-row">
            <span class="cm-team">${badge('c7',18)}${TEAMS.c7.label} — ${a.title}</span>
            <span class="cm-when">${fmtOra(a.start)}–${fmtOra(a.end)}</span>
          </div>
          <div class="conflict-match-row">
            <span class="cm-team">${badge('c11',18)}${TEAMS.c11.label} — ${b.title}</span>
            <span class="cm-when">${fmtOra(b.start)}–${fmtOra(b.end)}</span>
          </div>
        </div>
        <div class="conflict-options">
          <div class="option-box">
            <div class="opt-label">Opzione 1 — dividersi tra le due</div>
            <p>${opt1}</p>
          </div>
          <div class="option-box alt">
            <div class="opt-label">Opzione 2 — una sola squadra</div>
            <p>Gioca per intero una sola delle due partite e salta l'altra per questa giornata — nessun calcolo di spostamento necessario.</p>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function initConflicts(){
  renderConflicts();
  document.getElementById('travel-min').addEventListener('input', renderConflicts);
  document.getElementById('contingency-min').addEventListener('input', renderConflicts);
}
